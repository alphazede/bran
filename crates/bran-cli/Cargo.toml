[package]
name = "bran-cli"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
bran-core = { path = "../bran-core", version = "0.1.0" }
bran-tui = { path = "../bran-tui", version = "0.1.0" }
crossterm = { version = "=0.29.0", default-features = false, features = ["events", "windows"] }

# Test-only: enables `SdocBridgeConfig::new` for the CLI's fixture-bridge tests.
# Cargo unifies this with the normal dependency when building tests, and leaves
# it off for `cargo build --release`, which builds no dev-dependency.
[dev-dependencies]
bran-core = { path = "../bran-core", version = "0.1.0", features = ["test-fixtures"] }

[[bin]]
name = "bran"
path = "src/main.rs"
