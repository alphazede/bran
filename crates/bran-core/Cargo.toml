[package]
name = "bran-core"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
path = "src/lib.rs"

[features]
# Exposes `SdocBridgeConfig::new`, the unpinned test-fixture constructor, to
# dependants' test builds only. `bran-cli` enables it through a dev-dependency,
# so no shipped binary can construct a bridge that skips the pinned identity.
test-fixtures = []

[dependencies]
serde_json = "=1.0.151"

[[bench]]
name = "repository_scan"
path = "../../benches/repository_scan.rs"
harness = false

[[bench]]
name = "knowledge_graph"
path = "../../benches/knowledge_graph.rs"
harness = false

[[bench]]
name = "context_packet"
path = "../../benches/context_packet.rs"
harness = false
