schema_version: "1"

frontmatter:
  required:
    - type
    - title
    - okf_status
    - tags
  optional:
    - freshness
    - resource
    - public_boundary
  allowed:
    - type
    - title
    - okf_status
    - tags
    - freshness
    - resource
    - public_boundary
  canonical_docs_frontmatter_state: legacy_baseline

coverage:
  - canonical
  - legacy
  - excluded
  - unclassified

document_coverage:
  legacy_documents:
    - README.md
    - docs/integrations/agent-setup.md
  excluded_documents:
    skill/use-bran/SKILL.md: Agent skill frontmatter is parsed by the host and is not an OKF concept document.
    examples/headless/README.md: Headless command reference, not an OKF concept document.
  bridge_targets:
    - LICENSE-APACHE
    - LICENSE-MIT

tags:
  allowed:
    - developer
    - public

status:
  allowed:
    - draft
    - active
    - deprecated

public_boundary:
  values:
    - public
    - private
    - internal
  path_allowlist:
    - .
